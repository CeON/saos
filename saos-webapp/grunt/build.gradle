buildscript {
    repositories {
        mavenCentral()
        maven {
            url 'https://plugins.gradle.org/m2/'
        }
    }
    dependencies {
      classpath 'com.moowork.gradle:gradle-node-plugin:1.2.0'
    }
}

apply plugin: 'com.moowork.node'
apply plugin: 'com.moowork.grunt'

node {
	version = '12.22.1'
	download = false
}

task compileSass(type: Exec) {
    workingDir projectDir

    commandLine 'compass',
        'compile',
        '--sass-dir', '../src/main/webapp/WEB-INF/static/stylesheet/scss',
        '--css-dir', '../src/main/webapp/WEB-INF/static/stylesheet/.generated',
        '--output-style', 'expanded'
}

task prepareEnvForGrunt(dependsOn: grunt_build) {
	def path = '../src/main/webapp/WEB-INF/static/javascript/'
	
	FileCollection collection = files(new File(path + '.generated'))
	
	collection.each {File file ->
		if (!file.isDirectory()) {
			file.mkdirs()
		}
	}
}

// Work around for
// https://github.com/srs/gradle-grunt-plugin/issues/32
installGrunt.setArgs( ['install', 'grunt-cli@1.2.0', 'grunt@0.4.5'] )

task gruntBuild(dependsOn: grunt_build) {}

grunt_build.dependsOn 'compileSass'

grunt_build.dependsOn 'installGrunt'
grunt_build.dependsOn 'npmInstall'
